spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hotel}
    username: ${DATABASE_USERNAME:hotel}
    password: ${DATABASE_PASSWORD:hotel}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
security:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-to-a-32-byte-minimum}
  jwt-expiration: PT8H
  bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
