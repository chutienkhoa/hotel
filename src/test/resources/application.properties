# Test environment only. The PMS runtime default UI language is Vietnamese (vi); the existing test suite
# asserts English text, so tests default to English. Dedicated i18n tests override this explicitly.
hotel.i18n.default-locale=en

# Test-only fallback values for properties that have no default in src/main/resources/application.yml and are
# read by beans every @SpringBootTest instantiates regardless of what that test exercises (JwtService always
# needs security.jwt-secret; BootstrapAdmin's CommandLineRunner always needs the bootstrap-admin-* pair). These
# are placeholder strings, never real credentials, and never used outside the test classpath: production's own
# application.yml is unchanged and still requires JWT_SECRET/BOOTSTRAP_ADMIN_USERNAME/BOOTSTRAP_ADMIN_PASSWORD to
# be supplied for real. A -D system property or exported environment variable of the same name still overrides
# these (standard Spring property precedence), so CI/dev secrets management is unaffected.
#
# DATABASE_URL/DATABASE_USERNAME/DATABASE_PASSWORD deliberately have NO fallback here: every PostgreSQL
# integration test supplies its own Testcontainers connection via @DynamicPropertySource, which takes precedence
# over any value configured here, so a default would be misleading rather than helpful.
security.jwt-secret=test-only-jwt-signing-secret-not-a-real-credential-32-bytes-min
security.bootstrap-admin-username=test-bootstrap-admin
security.bootstrap-admin-password=test-bootstrap-admin-password
