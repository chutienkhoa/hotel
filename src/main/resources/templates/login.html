<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(#{auth.login.title})}"></head>
<body class="login-page">
<main aria-labelledby="login-heading" class="login-panel">
    <h1 id="login-heading" th:text="#{auth.login.title}">Sign in</h1>

    <p class="message message-error" th:if="${param.error}" th:text="#{auth.login.error}">
        Invalid username or password.
    </p>

    <form method="post" th:action="@{/login}">
        <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden" />

        <div class="form-field">
            <label for="username" th:text="#{auth.login.username}">Username</label>
            <input autocomplete="username" id="username" name="username" required type="text" />
        </div>

        <div class="form-field">
            <label for="password" th:text="#{auth.login.password}">Password</label>
            <input autocomplete="current-password" id="password" name="password" required type="password" />
        </div>

        <button class="button button-primary" th:text="#{auth.login.submit}" type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
