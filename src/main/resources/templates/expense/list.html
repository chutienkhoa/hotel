<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Expenses')}"></head>
<body>
<div class="app-shell page-expenses">
    <header th:replace="~{layout/header :: header}"></header>
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

    <main class="content">
        <div class="page-header">
            <div>
                <h1>Expenses</h1>
                <p>Manage Expense v1 drafts and lifecycle actions.</p>
            </div>
            <div class="action-row" th:if="${canManageExpense}">
                <a class="button button-secondary" th:href="@{/expense-categories}">Manage Categories</a>
                <a class="button button-primary" th:href="@{/expenses/new}">Create Expense</a>
            </div>
        </div>

        <p class="message message-success" th:if="${successMessage}" th:text="${successMessage}"></p>
        <p class="message message-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <section class="form-card" aria-label="Filter expenses">
            <form method="get" th:action="@{/expenses}">
                <th:block th:replace="~{layout/table :: sortState}"></th:block>
                <div class="form-grid">
                    <div class="form-field">
                        <label for="fromDate">From Date</label>
                        <input class="js-date-picker" id="fromDate" name="fromDate"
                               th:value="${searchCriteria.fromDate == null ? '' : #temporals.format(searchCriteria.fromDate, 'yyyy-MM-dd')}"
                               type="text" />
                    </div>
                    <div class="form-field">
                        <label for="toDate">To Date</label>
                        <input class="js-date-picker" id="toDate" name="toDate"
                               th:value="${searchCriteria.toDate == null ? '' : #temporals.format(searchCriteria.toDate, 'yyyy-MM-dd')}"
                               type="text" />
                    </div>
                    <div class="form-field">
                        <label for="categoryId">Category</label>
                        <select id="categoryId" name="categoryId">
                            <option th:selected="${searchCriteria.categoryId == null}" value="">
                                All categories
                            </option>
                            <option th:each="category : ${categories}"
                                    th:selected="${category.id == searchCriteria.categoryId}"
                                    th:text="${category.code}"
                                    th:value="${category.id}">ELECTRICITY</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option th:selected="${searchCriteria.status == null}" value="">All statuses</option>
                            <option th:each="expenseStatus : ${statuses}"
                                    th:selected="${expenseStatus == searchCriteria.status}"
                                    th:text="${expenseStatus}"
                                    th:value="${expenseStatus}">DRAFT</option>
                        </select>
                    </div>
                </div>
                <div class="action-row expense-filter-actions">
                    <a class="button button-secondary" th:href="@{/expenses}">Clear</a>
                    <button class="button button-primary" type="submit">Filter</button>
                </div>
            </form>
        </section>

        <section class="expense-results">
            <div class="results-toolbar" th:if="${expensePage != null}">
                <p><span th:replace="~{layout/table :: resultSummary(${expensePage})}">Showing 1&#8211;10 of 0</span></p>
                <nav th:replace="~{layout/table :: pagination(${expensePage}, 'Expense pages', 'pagination expense-pagination')}"></nav>
            </div>

            <div th:if="${expensePage != null and expensePage.empty and errorMessage == null}">
                <div th:if="${filtersActive}">
                    <div th:replace="~{layout/empty-state :: noResults('No expenses match the selected filters.', @{/expenses})}"></div>
                </div>
                <div th:unless="${filtersActive}">
                    <div th:replace="~{layout/empty-state :: emptyState('inbox', 'No expenses found.', null, null)}"></div>
                </div>
            </div>

            <div class="table-wrap" th:if="${expensePage != null and not expensePage.empty}">
                <table>
                    <thead>
                    <tr>
                        <th th:replace="~{layout/table :: sortHeader('Date', 'date')}"></th>
                        <th scope="col">Category</th>
                        <th th:replace="~{layout/table :: sortHeader('Amount', 'amount')}"></th>
                        <th scope="col">Payment method</th>
                        <th th:replace="~{layout/table :: sortHeader('Status', 'status')}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="expense : ${expensePage.content}">
                        <td><span th:replace="~{layout/datetime :: date(${expense.expenseDate})}">—</span></td>
                        <td>
                            <a th:href="@{/expenses/{id}(id=${expense.id})}" th:text="${expense.category.code}">ELECTRICITY</a>
                        </td>
                        <td class="table-number"><span th:replace="~{layout/money :: amount(${expense.amount}, ${expense.currency})}">0 VND</span></td>
                        <td th:text="${expense.paymentMethod}">CASH</td>
                        <td><span th:replace="~{layout/enum :: badge('expenseStatus', ${expense.status}, ${'status-badge--' + #strings.toLowerCase(expense.status)})}">DRAFT</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <th:block th:replace="~{layout/confirmation :: confirmation}"></th:block>
</div>
</body>
</html>
