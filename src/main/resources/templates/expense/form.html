<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${expense == null} ? 'Create expense' : 'Edit expense')}"></head>
<body>
<div class="app-shell page-expenses">
    <header th:replace="~{layout/header :: header}"></header>
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

    <main class="content">
        <a class="back-link" th:href="@{/expenses}">Back to expenses</a>
        <div class="page-header"><div>
            <h1 th:text="${expense == null} ? 'Create expense' : 'Edit expense'">Expense form</h1>
            <p>Currency is set to VND by the backend.</p>
        </div></div>
        <p class="message message-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <form class="form-card" data-confirm-message="Save this expense?" data-confirm-severity="NORMAL"
              th:attr="data-confirm-title=${expense == null} ? 'Create expense' : 'Update expense',data-confirm-label=${expense == null} ? 'Create expense' : 'Update expense'" method="post"
              th:action="${expense == null} ? @{/expenses} : @{/expenses/{id}(id=${expense.id})}"
              th:object="${expenseForm}">
            <p class="message message-error" th:if="${#fields.hasAnyErrors()}">
                Please correct the highlighted fields.
            </p>
            <div class="form-grid">
                <div class="form-field">
                    <label for="categoryId">Category</label>
                    <select id="categoryId" required th:field="*{categoryId}">
                        <option value="">Select a category</option>
                        <option th:each="category : ${categories}"
                                th:text="${category.active} ? ${category.code} : ${category.code + ' (Inactive)'}"
                                th:value="${category.id}">
                            ELECTRICITY
                        </option>
                    </select>
                    <p class="field-error" th:errors="*{categoryId}"></p>
                </div>
                <div class="form-field">
                    <label for="amount">Amount</label>
                    <input autocomplete="off" data-numeric="vnd" id="amount" inputmode="numeric" required th:field="*{amount}" type="text" />
                    <p class="field-error" th:errors="*{amount}"></p>
                </div>
                <div class="form-field">
                    <label for="expenseDate">Expense date</label>
                    <input id="expenseDate" name="expenseDate" required type="date"
                           th:value="${expenseForm.expenseDate == null ? '' : #temporals.format(expenseForm.expenseDate, 'yyyy-MM-dd')}" />
                    <p class="field-error" th:errors="*{expenseDate}"></p>
                </div>
                <div class="form-field">
                    <label for="paymentMethod">Payment method</label>
                    <select id="paymentMethod" required th:field="*{paymentMethod}">
                        <option value="">Select a payment method</option>
                        <option value="CASH">Cash</option>
                        <option value="BANK_TRANSFER">Bank transfer</option>
                        <option value="CREDIT_CARD">Credit card</option>
                        <option value="OTHER">Other</option>
                    </select>
                    <p class="field-error" th:errors="*{paymentMethod}"></p>
                </div>
            </div>
            <div class="form-field">
                <label for="description">Description</label>
                <textarea id="description" rows="4" th:field="*{description}"></textarea>
                <p class="field-error" th:errors="*{description}"></p>
            </div>
            <div class="form-actions">
                <a class="button button-secondary" th:href="@{/expenses}">Cancel</a>
                <button class="button button-primary" th:text="${expense == null} ? 'Create Expense' : 'Update Expense'" type="submit">
                    Save Expense
                </button>
            </div>
        </form>
    </main>

    <th:block th:replace="~{layout/confirmation :: confirmation}"></th:block>
</div>
</body>
</html>
