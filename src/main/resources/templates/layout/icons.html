<!-- Small, local, dependency-free outline icons shared by the sidebar navigation and the
     Reservation Detail information tiles. Every fragment shares one stroke-width baseline
     (1.8 -- global Task33 icon-weight standardization: slightly stronger than the original 1.6,
     short of the "excessively bold" ~2.0 ceiling). Displayed SIZE is intentionally NOT set here
     per-fragment beyond this shared 20x20 (1.25rem) default; each usage context sizes its icon via
     the --icon-size-* tokens in static/css/common/layout.css, not by editing this file. -->

     wrapper's CSS, not here. -->

</svg>
