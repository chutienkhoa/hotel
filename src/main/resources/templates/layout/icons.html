<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<body>
<!-- Small, local, dependency-free outline icons shared by the sidebar navigation and the
     Reservation Detail information tiles. Every fragment shares one stroke-width baseline
     (1.8 -- global Task33 icon-weight standardization: slightly stronger than the original 1.6,
     short of the "excessively bold" ~2.0 ceiling). Displayed SIZE is intentionally NOT set here
     per-fragment beyond this shared 20x20 (1.25rem) default; each usage context sizes its icon via
     the --icon-size-* tokens in static/css/common/layout.css, not by editing this file. -->

<svg th:fragment="user" aria-hidden="true" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="20">
    <circle cx="12" cy="8" r="3.5"></circle>
    <path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5"></path>
</svg>

<svg th:fragment="building" aria-hidden="true" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="20">

    <path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"></path>
    <path d="M10.5 19v-3h3v3"></path>
</svg>

<svg th:fragment="calendar" aria-hidden="true" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="20">

    <path d="M4 9.5h16M8 3v3.5M16 3v3.5"></path>
</svg>

<svg th:fragment="coins" aria-hidden="true" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="20">

    <path d="M3.5 11v4c0 1.66 2.46 3 5.5 3 .93 0 1.8-.13 2.56-.35"></path>
    <ellipse cx="15.5" cy="14" rx="5" ry="2.7"></ellipse>

<svg th:fragment="note" aria-hidden="true" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="20">

    <path d="M3.5 12h17"></path>
    <path d="M12 3.5c2.4 2.3 3.7 5.3 3.7 8.5s-1.3 6.2-3.7 8.5c-2.4-2.3-3.7-5.3-3.7-8.5s1.3-6.2 3.7-8.5Z"></path>
</svg>

<svg th:fragment="eye" aria-hidden="true" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="20">
    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path>
    <circle cx="12" cy="12" r="3"></circle>
</svg>

<!-- Task33 Batch 1A: mobile sidebar toggle (menu/close) and the header account-menu chevron. -->
<svg th:fragment="menu" aria-hidden="true" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="20">
    <path d="M4 6.5h16M4 12h16M4 17.5h16"></path>
</svg>

<svg th:fragment="close" aria-hidden="true" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="20">
    <path d="M6 6l12 12M18 6 6 18"></path>
</svg>

<svg th:fragment="chevronDown" aria-hidden="true" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="16">
    <path d="M5 9l7 7 7-7"></path>
</svg>

<!-- Task33 Batch 1B: global feedback / UI state infrastructure icons (toast, error dialogs, error pages,
     empty/no-results states). -->
<svg th:fragment="info" aria-hidden="true" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="20">
