<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<body>
<!-- Sortable column header. Requires tableSortBase/tableSortKey/tableSortDir from PaginationSupport.populate.
     A sort link never carries a page parameter, so changing the sort always returns to the first page. -->
<th scope="col" th:fragment="sortHeader(label, key)"
    th:attr="aria-sort=${tableSortKey == key ? (tableSortDir == 'asc' ? 'ascending' : 'descending') : 'none'}">
    <a class="table-sort-link"
       th:href="${tableSortBase + 'sort=' + key + '&amp;dir=' + (tableSortKey == key and tableSortDir == 'asc' ? 'desc' : 'asc')}">
        <span th:text="${label}">Column</span>
        <span aria-hidden="true" th:text="${tableSortKey == key ? (tableSortDir == 'asc' ? '&#9650;' : '&#9660;') : '&#8597;'}">&#8597;</span>
    </a>
</th>

<!-- "Showing 1-10 of 83" from the Page already loaded; no extra query. -->
<span th:fragment="resultSummary(page)"
      th:text="${page.totalElements == 0 ? '0 results' : 'Showing ' + (page.number * page.size + 1) + '&#8211;' + (page.number * page.size + page.numberOfElements) + ' of ' + page.totalElements}">Showing 1&#8211;10 of 83</span>

<!-- Paginator. Links preserve filters, sort and direction through tablePageBase. -->
<nav th:fragment="pagination(page, ariaLabel, cssClass)" th:aria-label="${ariaLabel}"
     th:class="${cssClass}" th:if="${page.totalPages > 1}">
    <a class="pagination__segment" th:if="${!page.first}"
       th:href="${tablePageBase + 'page=' + (page.number - 1)}">Previous</a>
    <th:block th:each="pageNumber : ${#numbers.sequence(paginationStartPage, paginationEndPage)}">
        <span aria-current="page" class="pagination__segment pagination__segment--current"
              th:if="${pageNumber == page.number}" th:text="${pageNumber + 1}">1</span>
        <a class="pagination__segment" th:unless="${pageNumber == page.number}"
           th:href="${tablePageBase + 'page=' + pageNumber}" th:text="${pageNumber + 1}">2</a>
    </th:block>
    <span class="pagination__segment pagination__segment--ellipsis"
          th:if="${paginationEndPage + 1 < page.totalPages - 1}">...</span>
    <a class="pagination__segment" th:if="${paginationEndPage < page.totalPages - 1}"
       th:href="${tablePageBase + 'page=' + (page.totalPages - 1)}" th:text="${page.totalPages}">2</a>
    <a class="pagination__segment" th:if="${!page.last}"
       th:href="${tablePageBase + 'page=' + (page.number + 1)}">Next</a>
</nav>

<!-- Hidden fields that keep the active sort when the filter form is submitted (the page resets to 0). -->
<th:block th:fragment="sortState">
    <input name="sort" th:if="${tableSortKey != null}" th:value="${tableSortKey}" type="hidden" />
    <input name="dir" th:if="${tableSortKey != null}" th:value="${tableSortDir}" type="hidden" />
</th:block>
</body>
</html>
