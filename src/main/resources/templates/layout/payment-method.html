<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<body>
<span th:fragment="label(paymentMethod)" th:switch="${paymentMethod}">
    <span th:case="'CASH'">Cash</span>
    <span th:case="'BANK_TRANSFER'">Bank Transfer</span>
    <span th:case="'CREDIT_CARD'">Credit Card</span>
    <span th:case="'OTHER'">Other</span>
    <span th:case="*">—</span>
</span>
</body>
</html>
