<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<body>
<!-- Renders an Instant in the hotel display timezone as dd/MM/yyyy HH:mm (24-hour, no seconds). -->
<span th:fragment="dateTime(value)"
      th:text="${value == null ? '—' : T(com.example.hotel.common.DisplayFormats).formatDateTime(value)}">—</span>

<!-- Renders a date-only value as dd/MM/yyyy. Never use this for Instant/timestamp values. -->
<span th:fragment="date(value)"
      th:text="${value == null ? '—' : T(com.example.hotel.common.DisplayFormats).formatDate(value)}">—</span>
</body>
</html>
