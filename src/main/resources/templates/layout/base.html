<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <!-- Browser tab: "Sunset Hotel | <Page Name>". Pages supply only their name; the brand is a proper name, never translated. -->
    <title th:text="'Sunset Hotel | ' + ${pageTitle}">Sunset Hotel</title>
    <!-- The one authoritative favicon declaration for every page (logo mark only). The same icon is also served at
         /favicon.ico, the URL browsers probe on their own, so no fallback can bring back another icon. Bump ?v= (a fixed
         value, not per request) when the artwork changes, to defeat browser favicon caching. -->
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/branding/sunset-hotel-favicon.png(v=2)}" />
    <link rel="apple-touch-icon" th:href="@{/images/branding/sunset-hotel-apple-touch-icon.png(v=2)}" />
    <!-- Translated strings for JavaScript: read with PmsI18n.t(key, fallback). -->
    <meta name="pms-i18n:js.datePicker.clear" th:content="#{js.datePicker.clear}" content="Clear" />
    <meta name="pms-i18n:js.datePicker.clear.aria" th:content="#{js.datePicker.clear.aria}" content="Clear date" />
    <meta name="pms-i18n:js.datePicker.today" th:content="#{js.datePicker.today}" content="Today" />
    <meta name="pms-i18n:js.datePicker.today.aria" th:content="#{js.datePicker.today.aria}" content="Select today" />
    <link rel="stylesheet" th:href="@{/css/vendor/flatpickr-4.6.13.min.css}" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" />
    <link rel="stylesheet" th:href="@{/css/common/stay-range-picker.css}" />
    <!-- Desktop sidebar collapse state: deliberately NOT deferred, so the remembered state is applied before the
         first paint instead of flashing the expanded sidebar on every page load. -->
    <script th:src="@{/js/common/sidebar-collapse.js}"></script>
    <!-- Optional domain stylesheet, set by a page with th:with="pageStylesheet=..." on its html element. -->
    <link rel="stylesheet" th:if="${pageStylesheet}" th:href="@{${pageStylesheet}}" />
    <script defer th:src="@{/js/common/i18n.js}"></script>
    <script defer th:src="@{/js/vendor/flatpickr-4.6.13.min.js}"></script>
    <script defer th:src="@{/js/common/date-picker.js}"></script>
    <script defer th:src="@{/js/common/stay-range-picker.js}"></script>
    <script defer th:src="@{/js/common/numeric-input.js}"></script>
    <script defer th:src="@{/js/common/confirmation.js}"></script>
    <!-- Task33 Batch 1A: app-shell foundation behavior (mobile sidebar drawer, header account menu). -->
    <script defer th:src="@{/js/common/nav-toggle.js}"></script>
    <script defer th:src="@{/js/common/header-account.js}"></script>
    <script defer th:src="@{/js/common/client-clock.js}"></script>
    <!-- Translated strings for toast.js. -->
    <meta name="pms-i18n:js.toast.close" th:content="#{js.toast.close}" content="Close" />
    <!-- Task33 Batch 1B: global feedback / UI state infrastructure. submit-guard.js loads after
         confirmation.js (see its own comment for why the order matters). -->
    <script defer th:src="@{/js/common/toast.js}"></script>
    <script defer th:src="@{/js/common/feedback-dialog.js}"></script>
    <script defer th:src="@{/js/common/submit-guard.js}"></script>
</head>
</html>
