<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<body>
<!-- Task33 Batch 1A header foundation. The mobile nav toggle controls the sidebar (layout/sidebar.html,
     id="sidebar-nav") via static/js/common/nav-toggle.js. The brand link is kept here (not just in the
     sidebar) because on a narrow viewport the sidebar is hidden off-canvas until opened, and the header is
     the only persistently visible chrome. Global search and the notification bell described in the
     specification (§6.2) are intentionally NOT implemented: no backend capability exists for a
     cross-domain search or for notifications (confirmed absent from the service/repository layer during
     the Batch 1 audit), and the specification's own §13 defers both beyond the approved header/list
     direction. Building a non-functional search input or bell would violate the "no dead controls"
     principle (§5) instead of satisfying it. -->
<header class="site-header" th:fragment="header">
    <div class="site-header-start">
        <button aria-controls="sidebar-nav" aria-expanded="false" class="header-nav-toggle" id="header-nav-toggle"
                th:aria-label="#{navigation.toggle.open}" th:attr="data-label-open=#{navigation.toggle.open},data-label-close=#{navigation.toggle.close}"
                type="button">
            <!-- th:replace substitutes the WHOLE host tag, including its own attributes, with the fragment's
                 markup -- so a class placed directly on the <svg> host below would never survive into the
                 rendered page (the icon fragment has no class of its own), and the aria-expanded-based
                 show/hide CSS in components.css would never match anything. Wrapping each icon in its own
                 <span> keeps the toggling class on a real element while only the inner <svg> is replaced. -->
            <span class="header-nav-toggle-icon-open"><svg th:replace="~{layout/icons :: menu}"></svg></span>
            <span class="header-nav-toggle-icon-close"><svg th:replace="~{layout/icons :: close}"></svg></span>
        </button>
        <a class="brand" th:href="@{/reservations}" th:text="#{common.app.name}">Sunset House</a>
    </div>

    <div class="site-header-end" th:if="${currentUsername != null}">
        <!-- Task33 header clock: the browser's local time, filled in by static/js/common/client-clock.js. Rendered
             empty and hidden so the server never supplies a time; it stays hidden if JavaScript does not run.
             The label is visually hidden text, not a live region, so the minute ticks are not announced. -->
        <div class="header-clock" id="header-clock" hidden>
            <span aria-hidden="true" class="header-clock-icon"><svg th:replace="~{layout/icons :: clock}"></svg></span>
            <span class="visually-hidden" th:text="#{common.clock.label}">Current time</span>
            <time id="header-clock-time"></time>
        </div>

        <!-- Global Task33 header redesign: the language control now sits immediately left of the
             account avatar, as its own compact flag trigger + popover, instead of living inside the
             Admin dropdown. Same visibility/toggle pattern as .header-account (hidden-attribute driven,
             mutually exclusive with it -- see static/js/common/header-account.js). -->
        <div class="header-language">
            <button aria-controls="header-language-menu" aria-expanded="false" aria-haspopup="menu"
                    class="header-language-trigger" id="header-language-trigger"
                    th:aria-label="#{common.language.label}" type="button">
                <span aria-hidden="true" class="header-language-flag"
                      th:text="${#locale.language == 'vi'} ? '🇻🇳' : '🇬🇧'">🇻🇳</span>
            </button>
            <div aria-labelledby="header-language-trigger" class="header-language-menu" hidden
                 id="header-language-menu" role="menu">
                <div th:replace="~{layout/language :: headerMenu}"></div>
            </div>
        </div>

        <div class="header-account">
            <button aria-controls="header-account-menu" aria-expanded="false" aria-haspopup="menu"
                    class="header-account-trigger" id="header-account-trigger" type="button">
                <span aria-hidden="true" class="header-account-initial"
                      th:text="${#strings.toUpperCase(#strings.substring(currentUsername, 0, 1))}">A</span>
                <span class="header-account-name" th:text="${currentUsername}">admin</span>
                <!-- Wrapped in a span: th:replace would drop a class placed on the svg itself, so the chevron's
                     size, colour and open-state rotation would never apply. -->
                <span aria-hidden="true" class="header-account-chevron"><svg th:replace="~{layout/icons :: chevronDown}"></svg></span>
            </button>
            <div aria-labelledby="header-account-trigger" class="header-account-menu" hidden
                 id="header-account-menu" role="menu">
                <form method="post" role="none" th:action="@{/logout}">
                    <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden" />
                    <button class="header-account-logout" role="menuitem" type="submit">
                        <!-- Deliberately not .sidebar-nav-icon: that class's light-gray color is tuned for the
                             dark sidebar and would be low-contrast here. No color override is set, so the SVG's
                             stroke="currentColor" simply follows this (dark-on-light) button's own text color. -->
                        <span class="header-account-logout-icon"><svg th:replace="~{layout/icons :: logout}"></svg></span>
                        <span th:text="#{navigation.logout}">Logout</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>
</body>
</html>
