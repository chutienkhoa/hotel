<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<body>
<!-- VI | EN switch. languageSwitchBase is the current URL (query only, without lang) ending in ? or &.
     A controller that renders a form from a POST sets languageSwitchPath to the matching GET route. -->
<nav aria-label="Language" class="language-switch" th:aria-label="#{common.language.label}" th:fragment="switcher">
    <a class="language-switch__option" hreflang="vi" lang="vi"
       th:aria-current="${#locale.language == 'vi'} ? 'true'"
       th:href="${(languageSwitchPath != null ? languageSwitchPath + '?' : languageSwitchBase) + 'lang=vi'}" th:text="#{common.language.vi}"
       th:title="#{common.language.vi.title}">VI</a>
    <span aria-hidden="true">|</span>
    <a class="language-switch__option" hreflang="en" lang="en"
       th:aria-current="${#locale.language == 'en'} ? 'true'"
       th:href="${(languageSwitchPath != null ? languageSwitchPath + '?' : languageSwitchBase) + 'lang=en'}" th:text="#{common.language.en}"
       th:title="#{common.language.en.title}">EN</a>
</nav>

<!-- Compact flag-based language popover for the authenticated app-shell header (global Task33 header
     redesign). Reuses the exact same languageSwitchBase/languageSwitchPath URL mechanism, pms-lang
     cookie and ?lang= semantics as the plain VI | EN switcher fragment above -- only the presentation
     differs. The plain switcher above is left untouched: login.html (logged out, no header account
     area) still renders it standalone.
     Active state comes from the request's resolved locale (#locale). Every row carries the same circular
     indicator; the active one is filled and holds a check. The condition sits on a wrapping span, not on the
     svg: th:replace replaces its host tag, which would otherwise drop the th:if and show a check on both rows. -->
<div th:fragment="headerMenu">
    <a class="header-language-option" hreflang="vi" lang="vi" role="menuitem"
       th:aria-current="${#locale.language == 'vi'} ? 'true'"
       th:href="${(languageSwitchPath != null ? languageSwitchPath + '?' : languageSwitchBase) + 'lang=vi'}">
        <span aria-hidden="true" class="header-language-option-flag">🇻🇳</span>
        <span class="header-language-option-label" th:text="#{common.language.vi.title}">Tiếng Việt</span>
        <span aria-hidden="true" class="header-language-option-indicator"
              th:classappend="${#locale.language == 'vi'} ? 'is-active'">
            <th:block th:if="${#locale.language == 'vi'}"><svg th:replace="~{layout/icons :: check}"></svg></th:block>
        </span>
    </a>
    <a class="header-language-option" hreflang="en" lang="en" role="menuitem"
       th:aria-current="${#locale.language == 'en'} ? 'true'"
       th:href="${(languageSwitchPath != null ? languageSwitchPath + '?' : languageSwitchBase) + 'lang=en'}">
        <span aria-hidden="true" class="header-language-option-flag">🇬🇧</span>
        <span class="header-language-option-label" th:text="#{common.language.en.title}">English</span>
        <span aria-hidden="true" class="header-language-option-indicator"
              th:classappend="${#locale.language == 'en'} ? 'is-active'">
            <th:block th:if="${#locale.language == 'en'}"><svg th:replace="~{layout/icons :: check}"></svg></th:block>
        </span>
    </a>
</div>
</body>
</html>
