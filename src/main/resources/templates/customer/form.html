<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${guest == null} ? 'Create guest' : 'Edit guest')}"></head>
<body>
<div class="app-shell page-guests">
    <header th:replace="~{layout/header :: header}"></header>
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

    <main class="content">
        <a class="back-link" th:href="@{/guests}">Back to guests</a>
        <div class="page-header"><div>
            <h1 th:text="${guest == null} ? 'Create guest' : 'Edit guest'">Guest form</h1>
            <p th:if="${guest == null}">The guest code is generated automatically after creation.</p>
            <p th:unless="${guest == null}">
                Guest code: <span th:text="${guest.guestCode}">G000001</span>
            </p>
        </div></div>

        <p class="message message-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <form class="form-card" data-confirm-message="Save this guest?" data-confirm-severity="NORMAL"
              enctype="multipart/form-data"
              th:attr="data-confirm-title=${guest == null} ? 'Create guest' : 'Update guest',data-confirm-label=${guest == null} ? 'Create guest' : 'Update guest'" method="post"
              th:action="${guest == null} ? @{/guests} : @{/guests/{id}(id=${guest.id})}"
              th:object="${guestForm}">
            <p class="message message-error" th:if="${#fields.hasAnyErrors()}">
                Please correct the highlighted fields.
            </p>

            <div class="form-grid guest-form-grid">
                <div class="form-field">
                    <label for="firstName">First name *</label>
                    <input id="firstName" maxlength="100" required th:field="*{firstName}" type="text" />
                    <p class="field-error" th:errors="*{firstName}"></p>
                </div>
                <div class="form-field">
                    <label for="lastName">Last name *</label>
                    <input id="lastName" maxlength="100" required th:field="*{lastName}" type="text" />
                    <p class="field-error" th:errors="*{lastName}"></p>
                </div>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input id="email" maxlength="255" th:field="*{email}" type="text" />
                    <p class="field-error" th:errors="*{email}"></p>
                </div>
                <div class="form-field">
                    <label for="phone">Phone</label>
                    <input id="phone" maxlength="100" th:field="*{phone}" type="text" />
                    <p class="field-error" th:errors="*{phone}"></p>
                </div>
                <div class="form-field">
                    <label for="nationality">Nationality *</label>
                    <select id="nationality" required th:field="*{nationality}">
                        <option value="">Select nationality</option>
                        <option th:if="${unmappedNationality != null}"
                                th:selected="${unmappedNationality == guestForm.nationality}"
                                th:text="${unmappedNationality}"
                                th:value="${unmappedNationality}">Unmapped nationality</option>
                        <option th:each="country : ${countries}"
                                th:selected="${country.name == guestForm.nationality}"
                                th:text="${country.flag + ' ' + country.name}"
                                th:value="${country.name}">🇻🇳 Vietnam</option>
                    </select>
                    <p class="field-error" th:errors="*{nationality}"></p>
                </div>
                <div class="form-field">
                    <label for="dateOfBirth">Date of birth</label>
                    <input class="js-date-picker" id="dateOfBirth" th:field="*{dateOfBirth}" type="text" />
                    <p class="field-error" th:errors="*{dateOfBirth}"></p>
                </div>

                <div class="form-field guest-form-address">
                    <label for="address">Address</label>
                    <textarea id="address" rows="4" th:field="*{address}"></textarea>
                    <p class="field-error" th:errors="*{address}"></p>
                </div>

                <section aria-labelledby="passport-heading" class="guest-passport-section guest-form-address">
                    <h2 id="passport-heading">Passport</h2>
                    <p th:if="${passportDocument == null}">No passport image uploaded.</p>
                    <p th:if="${passportDocument != null}">
                        Current: <a th:href="@{/guests/{id}/passport-image(id=${guest.id})}" target="_blank">View Passport</a>
                    </p>
                    <div class="form-field">
                        <label for="passportImage" th:text="${passportDocument == null} ? 'Passport image' : 'Replace passport image'">Passport image</label>
                        <input accept="image/jpeg,image/png" id="passportImage" name="passportImage" type="file" />
                        <p class="form-hint">JPG or PNG, maximum 5 MB.</p>
                        <p class="field-error" th:if="${passportError}" th:text="${passportError}"></p>
                    </div>
                </section>
            </div>

            <div class="form-actions">
                <a class="button button-secondary" th:href="@{/guests}">Cancel</a>
                <button class="button button-primary" th:text="${guest == null} ? 'Create Guest' : 'Update Guest'" type="submit">
                    Save Guest
                </button>
            </div>
        </form>
    </main>

    <th:block th:replace="~{layout/confirmation :: confirmation}"></th:block>
</div>
</body>
</html>
