<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Guests')}"></head>
<body>
<div class="app-shell page-guests">
    <header th:replace="~{layout/header :: header}"></header>
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

    <main class="content">
        <div class="page-header">
            <div>
                <h1>Guests</h1>
                <p>Manage guest profiles used by reservations.</p>
            </div>
            <a class="button button-primary" th:href="@{/guests/new}">Create Guest</a>
        </div>

        <p class="message message-success" th:if="${successMessage}" th:text="${successMessage}"></p>

        <section class="form-card" aria-label="Filter guests">
            <form method="get" th:action="@{/guests}">
                <div class="form-grid guest-form-grid">
                    <div class="form-field">
                        <label for="guestCode">Guest Code</label>
                        <input id="guestCode" name="guestCode" type="search"
                               th:value="${searchCriteria.guestCode}" />
                    </div>
                    <div class="form-field">
                        <label for="firstName">First Name</label>
                        <input id="firstName" name="firstName" type="search"
                               th:value="${searchCriteria.firstName}" />
                    </div>
                    <div class="form-field">
                        <label for="lastName">Last Name</label>
                        <input id="lastName" name="lastName" type="search"
                               th:value="${searchCriteria.lastName}" />
                    </div>
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="search"
                               th:value="${searchCriteria.email}" />
                    </div>
                    <div class="form-field">
                        <label for="nationality">Nationality</label>
                        <select id="nationality" name="nationality">
                            <option th:selected="${searchCriteria.nationality == null}" value="">
                                All nationalities
                            </option>
                            <option th:each="country : ${countries}"
                                    th:selected="${country.name == searchCriteria.nationality}"
                                    th:text="${country.flag + ' ' + country.name}"
                                    th:value="${country.name}">🇻🇳 Vietnam</option>
                        </select>
                    </div>
                </div>
                <div class="action-row guest-filter-actions">
                    <a class="button button-secondary" th:href="@{/guests}">Reset</a>
                    <button class="button button-primary" type="submit">Search</button>
                </div>
            </form>
        </section>

        <section class="guest-results">
            <div class="results-toolbar">
                <p>
                    <span th:text="${guestPage.totalElements}">0</span>
                    <span th:text="${guestPage.totalElements == 1 ? 'result' : 'results'}">results</span>
                </p>
                <nav aria-label="Guest pages" class="pagination guest-pagination"
                     th:if="${guestPage.totalPages > 1}">
                    <a class="pagination__segment" th:if="${!guestPage.first}"
                       th:href="${'/guests?' + (#strings.isEmpty(filterQueryString) ? '' : filterQueryString + '&') + 'page=' + (guestPage.number - 1)}">
                        Previous
                    </a>
                    <th:block th:each="pageNumber : ${#numbers.sequence(paginationStartPage, paginationEndPage)}">
                        <span aria-current="page" class="pagination__segment pagination__segment--current"
                              th:if="${pageNumber == guestPage.number}"
                              th:text="${pageNumber + 1}">1</span>
                        <a class="pagination__segment" th:unless="${pageNumber == guestPage.number}"
                           th:href="${'/guests?' + (#strings.isEmpty(filterQueryString) ? '' : filterQueryString + '&') + 'page=' + pageNumber}"
                           th:text="${pageNumber + 1}">2</a>
                    </th:block>
                    <span class="pagination__segment pagination__segment--ellipsis"
                          th:if="${paginationEndPage + 1 < guestPage.totalPages - 1}">...</span>
                    <a class="pagination__segment" th:if="${paginationEndPage < guestPage.totalPages - 1}"
                       th:href="${'/guests?' + (#strings.isEmpty(filterQueryString) ? '' : filterQueryString + '&') + 'page=' + (guestPage.totalPages - 1)}"
                       th:text="${guestPage.totalPages}">2</a>
                    <a class="pagination__segment" th:if="${!guestPage.last}"
                       th:href="${'/guests?' + (#strings.isEmpty(filterQueryString) ? '' : filterQueryString + '&') + 'page=' + (guestPage.number + 1)}">
                        Next
                    </a>
                </nav>
            </div>

            <p class="empty-state" th:if="${guestPage.empty}">No guests match the current filters.</p>

            <div class="table-wrap" th:unless="${guestPage.empty}">
                <table>
                    <thead>
                    <tr>
                        <th scope="col">Guest Code</th>
                        <th scope="col">First Name</th>
                        <th scope="col">Last Name</th>
                        <th scope="col">Email</th>
                        <th scope="col">Nationality</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="guest : ${guestPage.content}">
                        <td>
                            <a th:href="@{/guests/{id}(id=${guest.id})}" th:text="${guest.guestCode}">G000001</a>
                        </td>
                        <td th:text="${guest.firstName}">First name</td>
                        <td th:text="${guest.lastName}">Last name</td>
                        <td th:text="${guest.email}">email@example.com</td>
                        <td>
                            <span aria-hidden="true" th:if="${guest.nationality.flag != null}"
                                  th:text="${guest.nationality.flag}">🇻🇳</span>
                            <span th:text="${guest.nationality.displayName}">Vietnam</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <th:block th:replace="~{layout/confirmation :: confirmation}"></th:block>
</div>
</body>
</html>
