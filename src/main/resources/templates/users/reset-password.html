<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Reset password')}"></head>
<body>
<div class="app-shell page-users">
    <header th:replace="~{layout/header :: header}"></header>
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

    <main class="content">
        <a class="back-link" th:href="@{/users/{id}(id=${user.id})}">Back to user</a>
        <div class="page-header"><div>
            <h1>Reset Password</h1>
            <p th:text="${user.username}">an.le</p>
        </div></div>

        <p class="message message-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <form class="form-card" data-confirm-label="Reset password" data-confirm-message="Reset this user's password?"
              data-confirm-severity="WARNING" data-confirm-title="Reset password" method="post"
              th:action="@{/users/{id}/reset-password(id=${user.id})}">
            <div class="form-grid">
                <div class="form-field">
                    <label for="newPassword">New Password *</label>
                    <input autocomplete="new-password" id="newPassword" maxlength="72" minlength="8" name="newPassword" required type="password" />
                </div>
                <div class="form-field">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input autocomplete="new-password" id="confirmPassword" maxlength="72" minlength="8" name="confirmPassword" required type="password" />
                </div>
            </div>
            <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden" />
            <div class="form-actions">
                <a class="button button-secondary" th:href="@{/users/{id}(id=${user.id})}">Cancel</a>
                <button class="button button-primary" type="submit">Reset Password</button>
            </div>
        </form>
    </main>

    <th:block th:replace="~{layout/confirmation :: confirmation}"></th:block>
</div>
</body>
</html>
