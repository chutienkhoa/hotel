<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(#{reservation.otaReference.title})}"></head>
<body>
<div class="app-shell page-reservations">
    <header th:replace="~{layout/header :: header}"></header>
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

    <main class="content">
        <a class="back-link" th:href="@{/reservations/{id}(id=${reservation.id})}"
           th:text="#{reservation.modification.back}">Back to reservation</a>
        <div class="page-header">
            <div>
                <h1 th:text="#{reservation.otaReference.title}">Correct OTA Booking Reference</h1>
                <p th:text="#{reservation.otaReference.description}">Correct only the external OTA reference.</p>
            </div>
        </div>

        <p class="message message-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <dl class="detail-list">
            <dt th:text="#{reservation.modification.reservation}">Reservation</dt>
            <dd th:text="${reservation.reservationNumber}">R20260924-000001</dd>
            <dt th:text="#{reservation.otaReference.source}">Source</dt>
            <dd th:text="${reservation.source.displayName}">Booking.com</dd>
            <dt th:text="#{reservation.otaReference.current}">Current OTA reference</dt>
            <dd th:text="${reservation.otaBookingReference}">OTA-123</dd>
        </dl>

        <form class="form-card" method="post"
              th:action="@{/reservations/{id}/correct-ota-reference(id=${reservation.id})}"
              th:object="${otaReferenceForm}">
            <p class="message message-error" th:if="${#fields.hasAnyErrors()}"
               th:text="#{reservation.modification.fixErrors}">Please correct the highlighted fields.</p>
            <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden" />

            <div class="form-field">
                <label for="otaBookingReference" th:text="#{reservation.otaReference.new} + ' *'">Corrected OTA reference *</label>
                <input id="otaBookingReference" maxlength="255" required
                       th:field="*{otaBookingReference}" type="text" />
                <p class="field-error" th:errors="*{otaBookingReference}"></p>
            </div>

            <p class="text-muted" th:text="#{reservation.otaReference.immutableNotice}">
                Booking source and the legacy external booking identifier are not changed.
            </p>

            <div class="form-actions">
                <a class="button button-secondary" th:href="@{/reservations/{id}(id=${reservation.id})}"
                   th:text="#{common.action.cancel}">Cancel</a>
                <button class="button button-primary" th:text="#{reservation.otaReference.submit}" type="submit">Correct Reference</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
